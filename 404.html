<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – This Route Doesn’t Exist</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #121212;         /* Deep charcoal */
      --text: #d1d1d1;       /* Soft grey-white */
      --dim: #666666;        /* De-emphasized text */
      --accent: #e1ad01;     /* Professional amber */
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-align: center;
      line-height: 1.6;
    }

    /* Subtle Border Flash */
    .error-container {
      max-width: 600px;
      border-left: 3px solid var(--accent);
      padding: 20px 40px;
      text-align: left;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 15px;
    }

    p {
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    .status-code {
      font-size: 0.8rem;
      color: var(--dim);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    a.button {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 0;
      border-bottom: 1px solid var(--accent);
      transition: all 0.2s ease;
    }

    a.button:hover {
      background: var(--accent);
      color: #000;
      padding: 8px 15px;
      border-bottom-color: transparent;
    }

    footer {
      margin-top: 50px;
      font-size: 0.75rem;
      color: var(--dim);
    }
  </style>

</head>
<body>

<div class="error-container">
  <div class="status-code">Error Code: 0x194 // ICMP_DEST_UNREACHABLE</div>
  <h1>404 – Route Not Found</h1>
  <p>The packet you sent tried its best… but there's no destination here.<br>
  Either the link is incorrect, the file has been moved, or the route simply isn’t advertised in the current table.</p>

  <a href="https://thenetworklayer.com" class="button">Return to Gateway</a>
</div>

<footer>
  <p>TERMINAL_SESSION_CLOSED</p>
</footer>

</body>
</html>
